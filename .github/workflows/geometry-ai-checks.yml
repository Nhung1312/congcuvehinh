name: Geometry AI checks

on:
  push:
    branches:
      - main
      - chore/geometry-sync-to-main-no-api
  pull_request:
    paths:
      - 'src/ai/**'
      - 'src/components/EditorPanels/AIGeometryEditor.tsx'
      - 'src/components/TemplatesModal.tsx'
      - 'src/components/Sidebar.tsx'
      - 'src/components/Header.tsx'
      - 'src/App.tsx'
      - 'src/storage/textbookTemplates.ts'
      - 'src/storage/storageService.ts'
      - 'scripts/test_textbook_templates.ts'
      - 'api/geometry/parse.ts'
      - 'api/health.ts'
      - 'server.ts'
      - 'scripts/test_geometry_image.ts'
      - 'scripts/test_geometry_constructions.ts'
      - 'src/types/index.ts'
      - 'scripts/test_vercel_api_runtime.ts'
      - 'src/server/geminiGeometryService.ts'
      - 'src/renderers/GeometrySvg.tsx'
      - 'src/utils/resolveAuxiliaryPoints.ts'
      - 'scripts/test_geometry_ai_aux.ts'
      - 'scripts/test_geometry_ai_composite.ts'
      - 'scripts/test_geometry_tikz.ts'
      - 'src/export/tikzExport.ts'
      - 'package.json'
      - '.github/workflows/geometry-ai-checks.yml'

jobs:
  geometry-ai:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Planar geometry regression tests
        run: npm run test:geometry-ai
      - name: Composite geometry regression tests
        run: npm run test:geometry-ai-composite
      - name: TikZ export regression tests
        run: npm run test:geometry-tikz
      - name: Image question & prompt persistence UI tests
        run: npm run test:geometry-image
      - name: Explicit construction and image interpretation regression tests
        run: npm run test:geometry-constructions
      - name: Compiled API startup and request tests (plain Node ESM)
        run: npm run test:api-runtime
      - name: Textbook template geometry and SVG checks
        run: npm run test:textbook-templates
      - name: Production bundle check
        run: npm run build

